  <text x="80" y="86" fill="#163042" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Find Job API</text>
  <text x="80" y="114" fill="#5B6976" font-family="Arial, Helvetica, sans-serif" font-size="16">Illustrative preview based on the current Angular frontend</text>

  <g filter="url(#softShadow)">
