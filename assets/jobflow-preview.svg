<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">JobFlow product preview</title>
  <desc id="desc">Illustrative preview of the JobFlow frontend including the auth panel, search filters, results cards, and workspace navigation.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="80" x2="1070" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2E9DC"/>
      <stop offset="1" stop-color="#D9E3EA"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#163042"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="180" y1="90" x2="520" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1620"/>
      <stop offset="1" stop-color="#1B3B4E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#15222D" flood-opacity="0.16"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#15222D" flood-opacity="0.11"/>
    </filter>
  </defs>

