    <circle cx="136" cy="200" r="18" fill="#F59E0B" fill-opacity="0.18"/>
    <circle cx="312" cy="208" r="78" fill="#2DD4BF" fill-opacity="0.12"/>
    <rect x="106" y="186" width="128" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10"/>
    <text x="132" y="208" fill="#FFD08A" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ACCOUNT WORKSPACE</text>
    <text x="104" y="272" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">A sharper</text>
    <text x="104" y="312" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">job tracker</text>
    <text x="104" y="352" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">with real accounts.</text>
    <text x="104" y="392" fill="#D7E3EA" font-family="Arial, Helvetica, sans-serif" font-size="15">SQLite-backed users, generated API keys,</text>
    <text x="104" y="414" fill="#D7E3EA" font-family="Arial, Helvetica, sans-serif" font-size="15">protected routes, and a cleaner search desk.</text>

    <rect x="104" y="452" width="126" height="92" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
